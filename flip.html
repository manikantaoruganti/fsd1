<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .flip-container {
            perspective: 1000px;
        }

        .flip-card {
            width: 300px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s;
            cursor: pointer;
        }

        .flip-container:hover .flip-card {
            transform: rotateY(180deg);
        }

        .front,
        .back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 15px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 28px;
            font-weight: bold;

            backface-visibility: hidden;
        }

        .front {
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }

        .back {
            background: linear-gradient(135deg, #111827, #374151);
            transform: rotateY(180deg);
        }

        p {
            font-size: 16px;
            margin-top: 10px;
            font-weight: normal;
        }
    </style>
</head>

<body>

    <div class="flip-container">
        <div class="flip-card">

            <div class="front">
                FRONT
                <p>Hover to flip</p>
            </div>

            <div class="back">
                BACK
                <p>Hello World!</p>
            </div>

        </div>
    </div>

</body>

</html>
